<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mercadog — petshop com banho, tosa, consultas veterinárias e loja de produtos para o seu pet."
    />
    <!-- Combina com a navbar escura: no Android a barra do navegador vira
         extensão do header em vez de uma faixa de cor solta. -->
    <meta name="theme-color" content="#2E2622" />
    <meta name="color-scheme" content="light" />
    <title>Mercadog · Petshop, banho e tosa e veterinária</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Rolagem suave com inércia (Lenis). Carrega via CDN e falha em silêncio
         se estiver offline — o site continua rolando normalmente. -->
    <script defer src="https://cdn.jsdelivr.net/npm/lenis@1/dist/lenis.min.js"></script>
    <script>
      window.addEventListener('load', function () {
        // Acessibilidade: quem prefere menos movimento rola sem inércia
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
        if (typeof window.Lenis !== 'function') return
        var lenis = new window.Lenis({ lerp: 0.1, smoothWheel: true })
        function raf(time) {
          lenis.raf(time)
          requestAnimationFrame(raf)
        }
        requestAnimationFrame(raf)
      })
    </script>
  </body>
</html>
