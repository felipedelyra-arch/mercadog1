<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercadog · Tupã/SP · Petshop e clínica veterinária 24h</title>
    <meta
      name="description"
      content="Petshop e clínica veterinária no centro de Tupã/SP: emergência 24h, consultas, banho e tosa com agendamento online e loja com produtos veterinários, com retirada ou entrega."
    />
    <!-- Combina com a navbar escura: no Android a barra do navegador vira
         extensão do header em vez de uma faixa de cor solta. -->
    <meta name="theme-color" content="#2E2622" />
    <meta name="color-scheme" content="light" />

    <!-- Abre a conexão com o banco enquanto o JS ainda baixa: a primeira
         consulta (dados da loja, produtos) já encontra o caminho pronto. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- Endereço público do site. Se o domínio mudar,
         troque aqui, no public/robots.txt e no public/sitemap.xml. -->
    <link rel="canonical" href="https://www.mercadog.com.br/" />

    <!-- Prévia ao compartilhar o link (WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Mercadog" />
    <meta property="og:title" content="Mercadog · Petshop e clínica veterinária 24h em Tupã" />
    <meta
      property="og:description"
      content="Emergência 24h, consultas, banho e tosa com horário marcado pelo site e loja de produtos veterinários."
    />
    <meta property="og:url" content="https://www.mercadog.com.br/" />
    <meta property="og:image" content="https://www.mercadog.com.br/hero-dog.jpg" />
    <meta property="og:image:alt" content="Cachorro beagle sorrindo" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Dados da empresa para o Google (resultado local, mapa, telefone) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["VeterinaryCare", "PetStore"],
        "name": "Mercadog Clínica Veterinária e Pet Shop",
        "url": "https://www.mercadog.com.br/",
        "image": "https://www.mercadog.com.br/hero-dog.jpg",
        "telephone": "+55-14-3491-1244",
        "email": "wilsonaguiari@hotmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "R. Caingangs, 223 - Centro",
          "addressLocality": "Tupã",
          "addressRegion": "SP",
          "postalCode": "17600-070",
          "addressCountry": "BR"
        },
        "sameAs": ["https://instagram.com/mercadogpetshop", "https://facebook.com/mercadogpetshop"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
